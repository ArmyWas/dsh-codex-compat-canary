name: Weekly canary

on:
  schedule:
    - cron: '23 3 * * 3'
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: DeepSeek Harness ref
        required: false
        default: master
      codex_version:
        description: Exact Codex version or latest
        required: false
        default: latest

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-codex-compat-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: compatibility
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DSH_REF: ${{ inputs.dsh_ref || 'master' }}
          CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
        run: node bin/dsh-codex-canary.js --dsh-ref "$DSH_REF" --codex-version "$CODEX_VERSION" --json canary-report.json --fail-on review
      - if: ${{ always() && hashFiles('canary-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dsh-codex-compat-report
          path: canary-report.json
          retention-days: 30
      - if: ${{ always() && hashFiles('canary-report.json') != '' }}
        id: sentinel
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const { pathToFileURL } = require('node:url')
            const {
              buildIssueBody,
              decideAlertTransition,
              findingsFingerprint,
              ISSUE_TITLE,
              LEGACY_ISSUE_TITLE,
            } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'src', 'alert-state.js')).href)
            const report = JSON.parse(fs.readFileSync('canary-report.json', 'utf8'))
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            })
            const existing = issues.find(issue => (
              !issue.pull_request && [ISSUE_TITLE, LEGACY_ISSUE_TITLE].includes(issue.title)
            ))
            const fingerprint = findingsFingerprint(report)
            const transition = decideAlertTransition({ report, existingIssue: existing, fingerprint })
            core.setOutput('should_fail', String(transition.shouldFail))
            core.setOutput('transition', transition.kind)
            core.notice(`Canary alert transition: ${transition.kind}`)

            if (transition.kind === 'clean' || transition.kind === 'known') return
            if (transition.kind === 'resolved') {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `The implemented compatibility checks are green again. [Workflow run and JSON artifact](${runUrl})`,
              })
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                title: ISSUE_TITLE,
              })
              return
            }

            const body = buildIssueBody(report, runUrl, fingerprint)
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'open',
                title: ISSUE_TITLE,
                body,
              })
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: ISSUE_TITLE,
                body,
              })
            }
      - if: ${{ steps.compatibility.outcome == 'failure' && steps.sentinel.outputs.should_fail != 'false' }}
        run: exit 1

name: Weekly canary

on:
  schedule:
    - cron: '23 3 * * 3'
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: DeepSeek Harness ref
        required: false
        default: master
      codex_version:
        description: Exact Codex version or latest
        required: false
        default: latest

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-codex-compat-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: compatibility
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DSH_REF: ${{ inputs.dsh_ref || 'master' }}
          CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
        run: node bin/dsh-codex-canary.js --dsh-ref "$DSH_REF" --codex-version "$CODEX_VERSION" --json canary-report.json --fail-on review
      - if: ${{ always() && hashFiles('canary-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dsh-codex-compat-report
          path: canary-report.json
          retention-days: 30
      - if: ${{ always() && hashFiles('canary-report.json') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const report = JSON.parse(fs.readFileSync('canary-report.json', 'utf8'))
            const title = '[canary] Codex App Server protocol drift detected'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const values = report.findings.map(item => `- **${item.severity}** \`${item.id}\`: ${item.values.map(value => `\`${value}\``).join(', ')}`).join('\n')
            const body = [
              'The scheduled compatibility canary found protocol drift that meets the configured review threshold.',
              '',
              `- DeepSeek Harness: \`${report.dsh.packageVersion ?? 'unknown'}\` at \`${report.source.commit ?? report.source.ref ?? 'unknown'}\``,
              `- Codex baseline: \`${report.dsh.codexPin}\``,
              `- Codex target: \`${report.codex.targetVersion}\``,
              `- Status: **${report.summary.status}**`,
              '',
              values || '- No detailed finding was recorded.',
              '',
              `[Workflow run and JSON artifact](${runUrl})`,
            ].join('\n')
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100,
            })
            const existing = issues.find(issue => !issue.pull_request && issue.title === title)
            if (report.summary.status === 'compatible') {
              if (existing?.state === 'open') {
                await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'closed' })
              }
            } else if (existing) {
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, state: 'open', body })
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body })
            }
      - if: ${{ steps.compatibility.outcome == 'failure' }}
        run: exit 1

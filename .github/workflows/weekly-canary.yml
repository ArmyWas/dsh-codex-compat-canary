name: Weekly canary

on:
  schedule:
    - cron: '23 3 * * 3'
  workflow_dispatch:
    inputs:
      dsh_ref:
        description: DeepSeek Harness ref
        required: false
        default: master
      codex_version:
        description: Exact Codex version or latest
        required: false
        default: latest

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-codex-compat-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - id: compatibility
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DSH_REF: ${{ inputs.dsh_ref || 'master' }}
          CODEX_VERSION: ${{ inputs.codex_version || 'latest' }}
        run: node bin/dsh-codex-canary.js --dsh-ref "$DSH_REF" --codex-version "$CODEX_VERSION" --json canary-report.json --fail-on review
      - if: ${{ always() && hashFiles('canary-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: dsh-codex-compat-report
          path: canary-report.json
          retention-days: 30
      - if: ${{ always() && hashFiles('canary-report.json') != '' }}
        id: sentinel
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const path = require('node:path')
            const { pathToFileURL } = require('node:url')
            const { syncRunAlerts } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, '.github', 'scripts', 'sync-canary-alerts.mjs')).href)
            const report = JSON.parse(fs.readFileSync('canary-report.json', 'utf8'))
            await core.summary.addHeading('Codex compatibility canary')
              .addRaw(`Status: **${report.summary.status}**\n\n`)
              .addRaw(report.reportType === 'execution-error'
                ? `Stage: ${report.error.stage}. ${report.error.message}\n`
                : `Harness ${report.dsh.packageVersion}; Codex ${report.dsh.codexPin} → ${report.codex.targetVersion}.\n`)
              .write()
            await syncRunAlerts({ report, github, context, core })
      - if: ${{ steps.compatibility.outcome == 'failure' && steps.sentinel.outputs.should_fail != 'false' }}
        run: exit 1
